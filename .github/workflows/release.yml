# Builds every package and, for a version tag (v*), publishes a GitHub Release with all artifacts attached.
# Manual runs ("Run workflow") build and upload artifacts but do NOT release.
#
#   git tag v1.0.1 && git push origin v1.0.1      -> release with deb, AppImage, rpm, flatpak, msi, SHA256SUMS (GitHub-hosted)
#
# Local runners (see runners/runner.sh): run the Linux jobs on your own machine with
#   gh workflow run release.yml -f runner=self-hosted
# deb + AppImage + flatpak run on the "openbc-debian" runner, rpm on "openbc-fedora". The MSI builds on GitHub-hosted
# Windows unless you also pass  -f windows_runner=self-hosted  (needs the "openbc-windows" container runner).


# Runner choice (job "pick-runner"): tag pushes and manual runs default to "auto" - a local runner is used when
# an idle one with the right label is online, otherwise the job runs on GitHub-hosted. A queued job for an
# offline self-hosted runner would wait for up to 24 h, which is why availability is checked first.
# Listing runners needs a token with repository "Administration: read" (the built-in GITHUB_TOKEN cannot):
# add it as secret RUNNER_ADMIN_TOKEN. Without the secret "auto" safely means GitHub-hosted.
#
# UNTESTED scaffold: first run may need small tweaks (package names, WiX URL). Logs show which step.
name: release
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Where to run the Linux jobs (auto = self-hosted if an idle runner is online, else GitHub-hosted)
        type: choice
        options: [auto, github-hosted, self-hosted]
        default: auto
      windows_runner:
        description: Where to run the MSI job (auto = self-hosted if an idle openbc-windows runner is online, else GitHub-hosted)
        type: choice
        options: [auto, github-hosted, self-hosted]
        default: auto
  push:
    tags: ['v*']

permissions:
  contents: read

# Single source of truth for the version on tag builds: scripts/build.sh reads OPENBC_TAG, strips the
# leading "v" and passes -DCPACK_PACKAGE_VERSION to CMake (-> app_info.h, deb/rpm/msi/AppImage names).
# Empty on manual runs, where build.sh falls back to `git describe`.
env:
  OPENBC_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

jobs:
  # ------------------------------------------------------------------ choose self-hosted vs GitHub-hosted
  pick-runner:
    runs-on: ubuntu-24.04
    outputs:
      debian: ${{ steps.pick.outputs.debian }}
      fedora: ${{ steps.pick.outputs.fedora }}
      windows: ${{ steps.pick.outputs.windows }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
          REPO: ${{ github.repository }}
          LINUX_MODE: ${{ inputs.runner || 'auto' }}
          WINDOWS_MODE: ${{ inputs.windows_runner || 'auto' }}
        run: |
          set -uo pipefail
          runners=""
          if [ -n "${GH_TOKEN:-}" ]; then
            # one line per runner: status <TAB> busy <TAB> comma-separated labels (gh has jq built in)
            runners="$(gh api --paginate "repos/${REPO}/actions/runners" \
              --jq '.runners[] | [.status, (.busy | tostring), ([.labels[].name] | join(","))] | @tsv' 2>/dev/null)" || runners=""
          else
            echo "::notice::RUNNER_ADMIN_TOKEN is not set: cannot see local runners, 'auto' uses GitHub-hosted."
          fi
          # idle LABEL: an online, not busy runner that carries the label
          idle() {
            [ -n "$runners" ] || return 1
            echo "$runners" | awk -F'\t' -v l="$1" '
              $1 == "online" && $2 == "false" { n = split($3, a, ","); for (i = 1; i <= n; i++) if (a[i] == l) f = 1 }
              END { exit !f }'
          }
          # decide MODE LABEL -> true | false
          decide() {
            case "$1" in
              self-hosted)   echo true ;;                      # forced, as before
              github-hosted) echo false ;;
              *)             if idle "$2"; then echo true; else echo false; fi ;;
            esac
          }
          {
            echo "debian=$(decide "$LINUX_MODE" openbc-debian)"
            echo "fedora=$(decide "$LINUX_MODE" openbc-fedora)"
            echo "windows=$(decide "$WINDOWS_MODE" openbc-windows)"
          } | tee -a "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------ .deb + AppImage + Flatpak (one runner, one checkout)
  linux:
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.debian == 'true' && fromJSON('["self-hosted","openbc-debian"]') || 'ubuntu-24.04' }}
    steps:
      # Host build + deb + flatpak-builder + KDE runtime need several GB; free the preinstalled toolchains.
      # (GitHub-hosted only; the local image already has everything and must not be wiped.)
      - name: Free disk space
        if: needs.pick-runner.outputs.debian != 'true'
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Validate tag format
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::tag ${GITHUB_REF_NAME} must look like vMAJOR.MINOR.PATCH (MSI needs a numeric version)"; exit 1; }
      # Local image (runners/Dockerfile.debian) already ships Rust, Qt, flatpak and the generator's Python deps.
      - uses: dtolnay/rust-toolchain@stable
        if: needs.pick-runner.outputs.debian != 'true'
      - name: Install build + flatpak dependencies
        if: needs.pick-runner.outputs.debian != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config perl \
            qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools qt6-multimedia-dev \
            libqt6opengl6-dev libgl1-mesa-dev \
            libssl-dev zlib1g-dev liblzma-dev \
            flatpak flatpak-builder appstream \
            python3-aiohttp python3-tomlkit python3-yaml \
            qmake6 file desktop-file-utils curl
      - name: Add Flathub remote
        run: flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      # Ubuntu 24.04 runners block unprivileged user namespaces, which flatpak-builder's sandbox needs.
      # (Local container runs --privileged instead.)
      - name: Allow user namespaces
        if: needs.pick-runner.outputs.debian != 'true'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Separate steps keep failures attributable. The AppImage step reuses the host build tree left by the
      # deb step (no -c); the flatpak call skips the host build (it compiles inside its own sandbox) and does
      # not clean, so the deb and AppImage stay in build/lin/packages.
      - name: Build .deb
        run: ./scripts/build.sh -c -p lin -s deb
      - uses: actions/upload-artifact@v4
        with: { name: pkg-deb, path: build/lin/packages/*.deb }

      # linuxdeploy tools are AppImages themselves; keep them between runs.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/openbc/appimage-tools
          key: appimage-tools-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Build AppImage
        run: ./scripts/build.sh -p lin -s appimage
      - uses: actions/upload-artifact@v4
        with: { name: pkg-appimage, path: build/lin/packages/*.AppImage }

      - name: Generate offline Cargo sources
        run: |
          set -euo pipefail
          # The checkout already is the tagged source, so its Cargo.lock is the one the flatpak must vendor.
          # Prefer a generator committed to the repo (pinned); fall back to upstream.
          gen=scripts/packaging/flatpak-cargo-generator.py
          if [ ! -f "$gen" ]; then
            gen=/tmp/flatpak-cargo-generator.py
            curl -fsSL \
              https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py \
              -o "$gen"
          fi
          python3 "$gen" Cargo.lock -o scripts/packaging/cargo-sources.json
          test -s scripts/packaging/cargo-sources.json

      - name: Build Flatpak
        run: ./scripts/build.sh -p lin -s flatpak
      - uses: actions/upload-artifact@v4
        with: { name: pkg-flatpak, path: build/lin/packages/*.flatpak }

  # ------------------------------------------------------------------ .rpm (built on Fedora so it links Fedora's Qt/glibc)
  rpm:
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.fedora == 'true' && fromJSON('["self-hosted","openbc-fedora"]') || 'ubuntu-24.04' }}
    # Hosted: run inside a fedora container. Self-hosted: the runner container already is Fedora.
    container: ${{ needs.pick-runner.outputs.fedora != 'true' && 'fedora:latest' || null }}
    steps:
      - name: Install build dependencies
        if: needs.pick-runner.outputs.fedora != 'true'
        run: |
          dnf install -y git gcc-c++ make cmake ninja-build rust cargo rpm-build which perl-core \
            qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtmultimedia-devel mesa-libGL-devel libxkbcommon-devel \
            openssl-devel zlib-devel xz-devel
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: ./scripts/build.sh -c -p lin -s rpm
      - uses: actions/upload-artifact@v4
        with: { name: pkg-rpm, path: build/lin/packages/*.rpm }

  # ------------------------------------------------------------------ Windows MSI
  msi:
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.windows == 'true' && fromJSON('["self-hosted","openbc-windows"]') || 'windows-2022' }}



    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # Hosted: release:false -> reuse the runner's preinstalled C:\msys64 (build.sh hardcodes /c/msys64).
      # Self-hosted: runners/Dockerfile.windows already has MSYS2, the packages and WiX.
      - uses: msys2/setup-msys2@v2
        if: needs.pick-runner.outputs.windows != 'true'
        with:
          msystem: UCRT64
          release: false
          update: true
          install: >-
            git make
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-qt6-multimedia
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-xz
            mingw-w64-ucrt-x86_64-pkgconf
      - name: Install WiX 3.14 (heat/candle/light; build.sh looks in /c/msys64/opt/wix)
        if: needs.pick-runner.outputs.windows != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip -OutFile wix.zip
          Expand-Archive wix.zip -DestinationPath C:\msys64\opt\wix
      - name: Build MSI
        if: needs.pick-runner.outputs.windows != 'true'
        shell: msys2 {0}
        run: |
          ./scripts/build.sh -c -p win
      # Same script, but run through the container's own MSYS2 (the "msys2" shell only exists after setup-msys2).
      - name: Build MSI (self-hosted)
        if: needs.pick-runner.outputs.windows == 'true'
        shell: C:\msys64\usr\bin\bash.exe --login -eo pipefail {0}
        env:
          MSYSTEM: UCRT64
          CHERE_INVOKING: '1'
        run: |
          ./scripts/build.sh -c -p win
      - uses: actions/upload-artifact@v4
        with: { name: pkg-msi, path: build/win/packages/*.msi }

  # ------------------------------------------------------------------ GitHub Release (tags only)
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, rpm, msi]
    runs-on: ubuntu-24.04
    permissions:
      contents: write          # create the release and upload assets
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true