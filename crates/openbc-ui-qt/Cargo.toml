[package]
name = "openbc-ui-qt"
version = "0.1.0"
edition.workspace = true

[features]
default = ["qt", "binary"]
gpu = ["openbc-engine/gpu"]
binary = ["openbc-engine/binary"]
mem-stats = ["openbc-engine/mem-stats"]
qt = ["dep:cxx", "dep:cxx-qt", "dep:cxx-qt-build"]

[lib]
crate-type = ["staticlib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "openbc-qt"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
cxx = { version = "1.0", optional = true }
cxx-qt = { workspace = true, optional = true }
openbc-core = { path = "../openbc-core" }
openbc-engine = { path = "../openbc-engine", default-features = false }
openbc-observability = { path = "../openbc-observability" }
openbc-vfs = { path = "../openbc-vfs", features = ["sftp", "ftp", "network"] }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
tokio.workspace = true

[build-dependencies]
cxx-qt-build = { version = "0.7.3", optional = true }
pkg-config = "0.3"
