[package]
name = "openbc-engine"
version = "0.1.0"
edition.workspace = true

[dependencies]
openbc-compute = { path = "../openbc-compute" }
openbc-core = { path = "../openbc-core" }
openbc-observability = { path = "../openbc-observability" }
openbc-vfs = { path = "../openbc-vfs" }
rayon.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
async-trait = "0.1"
lofty = "0.22"

[dev-dependencies]
image = "0.25"

[features]
default = ["binary"]
# Binary (PE/ELF/Mach-O) compare actor; needs openbc-compute's LIEF-backed `binary` feature.
binary = ["openbc-compute/binary"]
gpu = ["openbc-compute/gpu"]
mem-stats = ["openbc-core/mem-stats"]
