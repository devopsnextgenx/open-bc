[package]
name = "openbc-compute"
version = "0.1.0"
edition.workspace = true

[features]
# STEP (truck) is on by default so 3D compare can open .step/.stp out of the box.
# Build with `default-features = false` to drop the truck dependency tree.
default = ["fmt-step"]
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]
fmt-step = ["dep:truck-stepio", "dep:truck-meshalgo"]
fmt-gltf = ["dep:gltf"]
fmt-3mf = ["dep:zip", "dep:roxmltree"]

[dependencies]
image = "0.25"
openbc-core = { path = "../openbc-core" }
openbc-observability = { path = "../openbc-observability" }
rayon.workspace = true
sha2 = "0.10"
thiserror.workspace = true
tokio.workspace = true
wgpu = { workspace = true, optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", optional = true }
truck-stepio = { version = "0.3", optional = true }
truck-meshalgo = { version = "0.4", optional = true }
gltf = { version = "1", optional = true }
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }
roxmltree = { version = "0.20", optional = true }
calamine = { version = "0.26", features = ["dates"] }
lofty = "0.22"