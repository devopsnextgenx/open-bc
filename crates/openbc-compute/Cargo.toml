[package]
name = "openbc-compute"
version = "0.1.0"
edition.workspace = true

[features]
# STEP (truck) is on by default so 3D compare can open .step/.stp out of the box.
# Build with `default-features = false` to drop the truck dependency tree.
default = ["fmt-step", "binary"]
# PE/ELF/Mach-O parsing for binary compare. Where LIEF ships a prebuilt SDK it is used (it
# downloads the SDK at build time); on x86_64-pc-windows-gnu (MSYS2/UCRT64) `lief` is not even a
# dependency (see the target table below) and the pure-Rust `object` backend (src/binary/native.rs)
# takes over automatically.
binary = ["dep:lief", "dep:object"]
# Force the pure-Rust backend on any target (used to test it on Linux/macOS).
binary-native = ["dep:object"]
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]
fmt-step = ["dep:truck-stepio", "dep:truck-meshalgo"]
fmt-gltf = ["dep:gltf"]
fmt-3mf = ["dep:zip", "dep:roxmltree"]

[dependencies]
image = "0.25"
openbc-core = { path = "../openbc-core" }
openbc-observability = { path = "../openbc-observability" }
rayon.workspace = true
sha2 = "0.10"
md-5 = "0.10"
sha1 = "0.10"
symphonia.workspace = true
thiserror.workspace = true
tokio.workspace = true
wgpu = { workspace = true, optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", optional = true }
truck-stepio = { version = "0.3", optional = true }
truck-meshalgo = { version = "0.4", optional = true }
gltf = { version = "1", optional = true }
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }
roxmltree = { version = "0.20", optional = true }
calamine = { version = "0.26", features = ["dates"] }
lofty = "0.22"
object = { version = "0.36", optional = true, default-features = false, features = ["read"] }

# LIEF publishes prebuilt SDKs only for MSVC / Linux / macOS / Android targets. The MinGW (gnu)
# Windows toolchain has none, and lief-build panics there ("Target: ... is not currently
# supported"), so the dependency is not present on that target at all.
[target.'cfg(not(all(windows, target_env = "gnu")))'.dependencies]
lief = { version = "1", optional = true }
