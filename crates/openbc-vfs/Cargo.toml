[package]
name = "openbc-vfs"
version = "0.1.0"
edition.workspace = true

[features]
default = ["local", "network", "native-watch", "archive"]
local = []
# OS file-change notifications (inotify / FSEvents / ReadDirectoryChangesW) as hints for
# observe::WatchHub. Polling always works without it.
native-watch = ["dep:notify"]
sftp = ["dep:ssh2"]
ftp = ["dep:suppaftp"]
# Renamed from the old placeholder `smb` feature: this crate never speaks
# SMB on the wire (see src/network.rs for why) - it wraps an already-mounted
# share/UNC path, which covers Samba shares and plain mapped network drives
# alike. `smb` is kept as an alias so an existing `--features smb` keeps
# working.
network = []
smb = ["network"]

# --- Archives as folders -------------------------------------------------------------------
# `archive` turns on every supported format. Each format is its own feature so a build can drop
# one (e.g. `archive-rar`: the UnRAR sources are under their own, non-OSI licence - see
# src/archive/mod.rs) without touching the rest. All of them need `archive-core`.
archive = ["archive-zip", "archive-tar", "archive-7z", "archive-rar", "archive-cab", "archive-ar"]
archive-core = ["dep:tempfile"]
# zip and everything zip-shaped: jar, war, apk, whl, nupkg, vsix, epub, docx, ...
archive-zip = ["archive-core", "dep:zip"]
# tar plus the stream compressors: .tar.gz/.tgz, .tar.bz2, .tar.xz, .tar.zst, .tar.lz4 and the
# single-file forms (.gz, .bz2, .xz, .zst, .lz4), which show up as a folder with one file.
archive-tar = ["archive-core", "dep:tar", "dep:flate2", "dep:bzip2", "dep:lzma-rust2", "dep:zstd", "dep:lz4_flex"]
archive-7z = ["archive-core", "dep:sevenz-rust2"]
archive-rar = ["archive-core", "dep:unrar"]
archive-cab = ["archive-core", "dep:cab"]
# Unix `ar` (.a, and .deb, which is an ar of tarballs).
archive-ar = ["archive-core", "dep:ar"]

[dependencies]
async-trait.workspace = true
notify = { version = "8", optional = true }
openbc-core = { path = "../openbc-core" }
openbc-observability = { path = "../openbc-observability" }
# `tokio` async backend + explicit-FTPS via native-tls. If the workspace
# already pulls in rustls elsewhere, swap this for `tokio-async-rustls` and
# `suppaftp::RustlsFtpStream`/`AsyncRustlsFtpStream` in ftp.rs instead.
rustls = "0.23"
tokio-rustls = "0.26"
rustls-native-certs = "0.8"
suppaftp = { version = "9.0", optional = true, features = ["tokio", "tokio-rustls-ring"] }
ssh2 = { version = "0.9", optional = true, features = ["vendored-openssl", "openssl-on-win32"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "io-util", "fs"] }
# Archive formats (all optional; see [features]).
tempfile = { version = "3", optional = true }
zip = { version = "9", default-features = false, features = ["deflate-flate2", "deflate64", "bzip2", "lzma", "xz", "zstd"], optional = true }
tar = { version = "0.4", default-features = false, optional = true }
flate2 = { version = "1", optional = true }
bzip2 = { version = "0.6", optional = true }
lzma-rust2 = { version = "0.23", default-features = false, features = ["std", "xz"], optional = true }
zstd = { version = "0.14", optional = true }
lz4_flex = { version = "0.14", default-features = false, features = ["std", "frame"], optional = true }
sevenz-rust2 = { version = "0.20", default-features = false, features = ["bzip2", "ppmd", "deflate"], optional = true }
unrar = { version = "0.5", optional = true }
cab = { version = "0.6", optional = true }
ar = { version = "0.9", optional = true }
[dev-dependencies]
tempfile = "3"
async-trait.workspace = true
